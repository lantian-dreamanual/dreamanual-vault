<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 660px; height: 400px; overflow: hidden; }
.bg {
  width: 660px; height: 400px;
  /* 与应用同源的深色：侧栏材质的近黑，往图标底板的暖黑压 */
  background: linear-gradient(135deg, #2A2A2C 0%, #1A1817 100%);
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}
/* 中间箭头 */
.arrow-wrap {
  position: absolute;
  left: 50%; top: 42%;
  transform: translate(-50%, -50%);
}
/* 底部文字 */
.hint {
  position: absolute;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: #F2F4F8;
  opacity: 0.42;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="bg">
  <div class="arrow-wrap">
    <svg width="320" height="80" viewBox="0 0 320 80">
      <defs>
        <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#43A7F9" stop-opacity="0.3"/>
          <stop offset="0.2" stop-color="#43A7F9" stop-opacity="0.85"/>
          <stop offset="1" stop-color="#2A6AE0"/>
        </linearGradient>
      </defs>
      <!-- 粗直线 -->
      <rect x="8" y="28" width="250" height="24" rx="12" fill="url(#arrowGrad)"/>
      <!-- 实心三角箭头 -->
      <path d="M 220 0 L 320 40 L 220 80 Z" fill="#2A6AE0"/>
    </svg>
  </div>
  <div class="hint">拖拽到 Applications 文件夹安装</div>
</div>
</body>
</html>
